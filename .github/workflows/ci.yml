name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.8.8
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy app
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Render migration SQL
        env:
          DATABASE_MIGRATION_URL: postgresql+psycopg://user:password@localhost:5432/postgres
        run: uv run alembic upgrade head --sql > migration.sql
      - name: Dependency audit
        run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Render tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
