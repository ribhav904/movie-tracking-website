[project]
name = "entertainment-tracker-api"
version = "0.1.0"
description = "Local-first FastAPI backend for a private entertainment tracker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pyjwt==2.15.1",
  "sqlalchemy[asyncio]==2.1.6",
  "starlette==1.10.0",
  "structlog==26.1.0",
  "typer==0.27.3",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.17.3",
]

[project.scripts]
entertainment-users = "app.cli.users:app"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests that require the remote Supabase project"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic/versions"]
