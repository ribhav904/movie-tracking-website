[project]
name = "entertainment-tracker-api"
version = "0.1.0"
description = "Local-first FastAPI backend for a private entertainment tracker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.4",
  "cryptography==50.0.0",
  "email-validator==2.2.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pyjwt==2.13.0",
  "sqlalchemy[asyncio]==2.0.43",
  "starlette==1.4.1",
  "structlog==25.4.0",
  "typer==0.16.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "ruff==0.12.8",
]

[project.scripts]
entertainment-users = "app.cli.users:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests that require the remote Supabase project"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic/versions"]
